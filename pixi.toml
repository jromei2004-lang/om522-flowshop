[workspace]
name = "om522-flowshop"
version = "0.1.0"
description = "OM 522 Option 6: permutation flow shop decision tool (total weighted tardiness)"
channels = ["conda-forge"]
platforms = ["win-64", "osx-arm64", "osx-64"]

[dependencies]
python = "3.12.*"
pandas = "*"
numpy = "*"
matplotlib = "*"
pytest = "*"

[pypi-dependencies]
# Our own code in src/flowshop, installed so tests and tasks can import it.
flowshop = { path = ".", editable = true }

[tasks]
# Pixi runs tasks in its own cross-platform shell, so these behave the same in
# PowerShell and the Mac terminal. compare and plot are placeholders for now.
test = "pytest"
solve = "python -m flowshop.cli"
compare = "echo 'compare is not implemented yet'"
plot = "echo 'plot is not implemented yet'"
